name: Physical brewing model validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/physics-based-brewing-engine]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        # The repository's existing lockfile is out of sync with package.json (html2canvas-pro).
        # npm install resolves that mismatch for CI; update/commit package-lock.json separately.
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Test physical model
        run: npm run test:physics
      - name: Build app
        run: npm run build
