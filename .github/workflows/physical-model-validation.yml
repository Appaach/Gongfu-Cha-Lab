name: Physical brewing model validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/physics-based-brewing-engine]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Test physical model
        run: npm run test:physics
      - name: Build app
        run: npm run build
